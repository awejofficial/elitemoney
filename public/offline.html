<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline — PEIT</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    background: #f7f5ec;
    color: #24261f;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1d16; color: #ede9d8; }
    .badge { background: #c7be93 !important; color: #1c1d16 !important; }
    button { background: #c7be93 !important; color: #1c1d16 !important; }
  }
  .badge {
    width: 56px;
    height: 56px;
    border-radius: 18px;
    background: #8b8262;
    color: #f7f5ec;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 0; opacity: 0.7; max-width: 22rem; font-size: 14px; }
  button {
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 500;
    background: #8b8262;
    color: #f7f5ec;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="badge">📡</div>
  <h1>You're offline</h1>
  <p>PEIT needs a connection to load your data. Reconnect and try again — nothing was lost.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
