<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="emBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="emGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#emBg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Elite E Monogram -->
  <g fill="url(#emGrad)">
    <!-- Vertical Spine -->
    <rect x="15" y="14" width="8" height="36" rx="4" />
    
    <!-- Top Bar -->
    <path d="M19 14 H43 C45.2 14 47 15.8 47 18 C47 20.2 45.2 22 43 22 H19 Z" />
    
    <!-- Middle Bar -->
    <path d="M19 28 H37 C39.2 28 41 29.8 41 32 C41 34.2 39.2 36 37 36 H19 Z" />
    
    <!-- Bottom Bar -->
    <path d="M19 42 H43 C45.2 42 47 43.8 47 46 C47 48.2 45.2 50 43 50 H19 Z" />
  </g>

  <!-- Financial Ascent Diamond Accent -->
  <circle cx="47" cy="18" r="3.5" fill="url(#accentGrad)" filter="url(#glow)" />
</svg>
